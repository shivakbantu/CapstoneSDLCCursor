{% extends "base.html" %}
{% block content %}
<section class="page booking-page" data-hotel-id="{{ hotel_id }}" data-step="2">
  {% include "_booking_steps.html" %}
  <h1>Guest details</h1>
  <p class="lede">Tell us who is staying. Phone is optional.</p>
  <form id="guest-form" class="guest-form" novalidate data-testid="guest-form">
    <div class="field">
      <label for="guest-first-name">First name</label>
      <input type="text" id="guest-first-name" name="firstName" required
             autocomplete="given-name" data-testid="guest-first-name">
      <span class="field-error" data-error-for="guest-first-name" hidden></span>
    </div>
    <div class="field">
      <label for="guest-last-name">Last name</label>
      <input type="text" id="guest-last-name" name="lastName" required
             autocomplete="family-name" data-testid="guest-last-name">
      <span class="field-error" data-error-for="guest-last-name" hidden></span>
    </div>
    <div class="field">
      <label for="guest-email">Email</label>
      <input type="email" id="guest-email" name="email" required
             autocomplete="email" data-testid="guest-email">
      <span class="field-error" data-error-for="guest-email" hidden></span>
    </div>
    <div class="field">
      <label for="guest-phone">Phone <span class="optional">(optional)</span></label>
      <input type="tel" id="guest-phone" name="phone"
             autocomplete="tel" data-testid="guest-phone">
      <span class="field-error" data-error-for="guest-phone" hidden></span>
    </div>
    <div class="field">
      <label for="guest-count">Guests</label>
      <input type="number" id="guest-count" name="guestsCount" min="1" step="1" value="1" required
             data-testid="guest-count">
      <span class="field-error" data-error-for="guest-count" hidden></span>
    </div>
  </form>
  <div class="booking-nav">
    <a class="btn btn-secondary" href="{{ url_for('pages.booking_room', hotel_id=hotel_id) }}"
       data-testid="btn-back">Back</a>
    <button type="button" class="btn btn-primary" id="btn-continue" data-testid="btn-continue">
      Continue
    </button>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/booking-guest.js') }}"></script>
{% endblock %}
